<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">
<div class="w-full max-w-sm rounded-2xl border border-slate-700 bg-slate-950 p-6 text-center">
<h2 class="font-bold text-lg">Support Developer</h2>
<p class="text-sm text-slate-400 mt-1">Amount: <span id="amt" class="text-emerald-300 font-bold"></span> USD</p>
<p class="mono text-xs text-slate-500 mt-1 break-all">To: <span id="to"></span></p>
<div class="mt-4 p-2 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-xs text-emerald-300">No single limitation — 5 on-ramps + 8 networks — fastest wins</div>
<div id="providers" class="mt-4 grid grid-cols-2 gap-2 text-xs"></div>
<div id="networks" class="mt-3 grid grid-cols-3 gap-1 text-xs"></div>
<div id="social" class="mt-3 p-2 rounded-lg bg-violet-500/10 border border-violet-500/20 text-xs text-violet-300 hidden">
  <div class="font-semibold">Social Sign-In (no wallet needed)</div>
  <div class="grid grid-cols-3 gap-1 mt-2">
    <button data-social="google" class="p-1 rounded bg-white text-slate-900">Google</button>
    <button data-social="email" class="p-1 rounded bg-white text-slate-900">Email</button>
    <button data-social="github" class="p-1 rounded bg-white text-slate-900">GitHub</button>
  </div>
</div>
<div class="mt-4 space-y-3">
<button id="pay-card" class="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 font-bold">Pay with Card (Best Available)</button>
<button id="pay-crypto" class="w-full py-3 rounded-xl border border-slate-700 text-slate-200">Pay with Crypto (Multi-Network)</button>
<button id="cancel" class="w-full py-2 text-slate-500 text-sm">Cancel</button>
</div>
<p class="text-xs text-slate-600 mt-4">Funds go directly to developer's Web3 wallet. No custody.</p>
</div>
<script>
const params = new URLSearchParams(location.search);
document.getElementById("amt").textContent = params.get("amount") || "5";
document.getElementById("to").textContent = params.get("to") || "";
let selectedProvider = params.get("provider") || "";
let selectedChain = params.get("chainId") || "1";
const isSocial = params.get("social") === "1";
if (isSocial) document.getElementById("social").classList.remove("hidden");
const NETWORKS = [
  { id:"1", name:"Ethereum", logo:"♦" }, { id:"137", name:"Polygon", logo:"⬣" }, { id:"56", name:"BSC", logo:"●" },
  { id:"42161", name:"Arbitrum", logo:"▲" }, { id:"10", name:"Optimism", logo:"◉" }, { id:"8453", name:"Base", logo:"■" },
  { id:"solana", name:"Solana", logo:"◎" }, { id:"ton", name:"TON", logo:"◆" },
];
function renderNetworks(){
  const div=document.getElementById("networks");
  div.innerHTML = NETWORKS.map(n=> `<button data-chain="${n.id}" class="net-btn p-1 rounded border ${selectedChain===n.id?'border-cyan-500 bg-cyan-500/20 text-cyan-300':'border-slate-700 bg-slate-900 text-slate-400'} text-xs">${n.logo} ${n.name}</button>`).join("");
  div.querySelectorAll(".net-btn").forEach(b=> b.onclick=()=>{ selectedChain=b.dataset.chain; renderNetworks(); });
}
renderNetworks();
async function loadProviders(){
  try{
    const r = await fetch("https://gdbx.xup.workers.dev/gdmx/providers");
    const j = await r.json();
    const div = document.getElementById("providers");
    div.innerHTML = j.providers.map(p=> `<button data-id="${p.id}" class="provider-btn p-2 rounded-lg border ${selectedProvider===p.id ? 'border-amber-500 bg-amber-500/20 text-amber-300' : 'border-slate-700 bg-slate-900 text-slate-300'} hover:border-amber-500/50"><span>${p.logo}</span> ${p.name}<br><span class="text-xs text-slate-500">${p.fee} ${p.configured ? '✓' : 'mock'}</span></button>`).join("");
    div.querySelectorAll(".provider-btn").forEach(b=> b.onclick=()=>{ selectedProvider=b.dataset.id; loadProviders(); });
  }catch{}
}
loadProviders();
document.getElementById("pay-card").onclick = async () => {
  const to = params.get("to"), amount = params.get("amount");
  const prov = selectedProvider ? `&provider=${encodeURIComponent(selectedProvider)}` : "";
  const chain = selectedChain ? `&chainId=${encodeURIComponent(selectedChain)}` : "";
  const res = await fetch(`https://gdbx.xup.workers.dev/gdmx/create-checkout?to=${encodeURIComponent(to)}&amount=${encodeURIComponent(amount)}${prov}${chain}`).catch(()=>null);
  if (res && res.ok) { const j = await res.json(); if (j.url) { location.href = j.url; return; } }
  parent.postMessage({ type: "GDMX_SUCCESS", txHash: "0xMOCK_"+Date.now(), chainId: selectedChain }, "https://gdmx.pages.dev");
  if (window.parent !== window) parent.postMessage({ type: "GDMX_SUCCESS", txHash: "0xMOCK_"+Date.now(), chainId: selectedChain }, "*");
  document.body.innerHTML = '<div class="text-emerald-300 p-6">✓ Card payment via '+(selectedProvider||"best available")+' on chain '+selectedChain+' — USDC will arrive</div>';
};
document.getElementById("pay-crypto").onclick = () => {
  const chain = selectedChain;
  parent.postMessage({ type: "GDMX_CRYPTO", chainId: chain, to: params.get("to"), amount: params.get("amount") }, "*");
  parent.postMessage({ type: "GDMX_CRYPTO", chainId: chain }, "https://gdmx.pages.dev");
  alert("Crypto on chain "+chain+" — auto-switch if needed, gasless if enabled");
};
document.querySelectorAll("[data-social]").forEach(b=> b.onclick=()=>{
  const prov=b.dataset.social;
  parent.postMessage({ type: "GDMX_SOCIAL", provider: prov, chainId: selectedChain }, "*");
  parent.postMessage({ type: "GDMX_SOCIAL", provider: prov }, "https://gdmx.pages.dev");
});
document.getElementById("cancel").onclick = () => parent.postMessage({ type: "GDMX_CANCELLED" }, "*");
</script>
</body></html>
